version: "3.8"

# Full Medisphere Healthcare Platform stack:
#   postgres            -> shared PostgreSQL database
#   backend             -> Spring Boot API (auth, patients, appointments, vitals,
#                           alerts, care plans, consent, twins, reports, predictions)
#   ml-service          -> Flask ML microservice (model versioning, prediction,
#                           SHAP explainability)
#   monitoring-service  -> Node/Express + Socket.IO microservice (Milestone 3:
#                           clinical rule engine, mobile-style real-time
#                           notifications) -- reads/writes ml_predictions +
#                           ml_patient_data (Milestone 2's demo patient set)
#   frontend            -> React app (nginx-served production build)
#   kafka/kafka-ui      -> optional, only needed for live vitals streaming
#
# Quick start:
#   docker compose up -d --build
#   # then open http://localhost:3000
#
# Everything also runs locally without Docker -- see the root README.

services:
  postgres:
    image: postgres:16
    container_name: medisphere-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-medisphere}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs once, only on a brand-new (empty) volume, in alphabetical
      # filename order: creates the ML tables (model_versions,
      # ml_predictions, shap_explanations, ml_patient_data) and then the
      # Milestone 3 tables (clinical_rules, rule_executions,
      # notifications -- z_monitoring_schema.sql, which has FKs into the
      # ML tables so it must run after them; the "z" prefix guarantees
      # that). The Java backend creates its OWN tables (users, patients,
      # appointments, predictions, ...) itself on first boot via
      # Hibernate ddl-auto=update + data.sql -- nothing else to run here
      # for those.
      - ./database:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: medisphere-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-medisphere}?TimeZone=Asia/Kolkata
      DB_USERNAME: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-change-this-super-secret-key-before-deploying-please-32chars}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8080:8080"

  ml-service:
    build: ./ml-service
    container_name: medisphere-ml-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-medisphere}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5000:5000"

  monitoring-service:
    build: ./monitoring-service
    container_name: medisphere-monitoring-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${DB_NAME:-medisphere}
      PGUSER: ${DB_USER:-postgres}
      PGPASSWORD: ${DB_PASSWORD:-postgres}
      PORT: 4000
      CORS_ORIGIN: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      # Single-host by default: the browser only ever talks to this one
      # origin (http://localhost:3000). nginx.conf proxies /api, /ml,
      # /monitoring, and /socket.io to the other three services
      # internally -- their ports below are still published for direct
      # debugging (curl, Postman) but the app itself needs only this one.
      args:
        VITE_API_BASE_URL: /api
        VITE_ML_API_URL: /ml
        VITE_MONITORING_API_URL: /monitoring
    container_name: medisphere-frontend
    restart: unless-stopped
    depends_on:
      - backend
      - ml-service
      - monitoring-service
    ports:
      - "3000:80"

  # Optional: local Kafka broker for live vitals streaming. The backend
  # starts fine without it (vitals just won't stream). KRaft mode, no
  # ZooKeeper needed.
  kafka:
    image: apache/kafka:3.7.0
    container_name: medisphere-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data

  # Optional: web UI to inspect Kafka topics/messages.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: medisphere-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

volumes:
  postgres_data:
  kafka_data:
