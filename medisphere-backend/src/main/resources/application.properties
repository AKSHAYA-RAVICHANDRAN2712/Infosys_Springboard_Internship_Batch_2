# ==========================================
# MediSphere Application
# ==========================================

spring.application.name=medisphere-backend

# ==========================================
# Server Configuration
# ==========================================

server.port=8080

# ==========================================
# PostgreSQL Database
# ==========================================

spring.datasource.url=jdbc:postgresql://localhost:5432/medisphere
spring.datasource.username=postgres
spring.datasource.password=MediSphere@123
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / Hibernate
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# JWT Configuration
# ==========================================

app.jwt.secret=CHANGE_THIS_TO_A_LONG_SECRET_KEY_FOR_MEDISPHERE
app.jwt.expiration=86400000

# ==========================================
# Logging
# ==========================================

logging.level.org.springframework.security=INFO
logging.level.com.medisphere=INFO